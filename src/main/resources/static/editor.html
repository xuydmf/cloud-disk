<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>在线编辑 · 云盘</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="ed-page">

<div class="editor ed-full">
    <header class="ed-head">
        <a class="ed-back" id="edBack" href="index.html" title="返回云盘">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <span class="ed-mark" id="edMark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M9 4v16M15 4v16"/></svg>
        </span>
        <span class="ed-name" id="edName">加载中…</span>
        <span class="ed-dirty" id="edDirty" hidden>未保存</span>
        <span class="ed-notice" id="edNotice" hidden></span>
        <span class="ed-spacer"></span>
        <button class="btn btn-ghost ed-btn" id="edReload" type="button">
            <span class="btn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></span>
            <span>重新载入</span>
        </button>
        <button class="btn btn-primary ed-btn" id="edSave" type="button">
            <span class="btn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 4v5h6V4"/><path d="M8.5 20v-6h7v6"/></svg></span>
            <span>保存</span>
        </button>
        <button class="btn btn-ghost ed-btn" id="edClose" type="button">
            <span class="btn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></span>
            <span>关闭</span>
        </button>
    </header>

    <!-- 表格视图 -->
    <div class="ed-tabs" id="sheetTabs" hidden></div>
    <div class="ed-grid-wrap" id="sheetView">
        <table class="ed-grid" id="sheetGrid"></table>
    </div>

    <!-- 文本视图 -->
    <div class="ed-text-wrap" id="textView" hidden>
        <textarea class="ed-text" id="textArea" spellcheck="false" wrap="off"></textarea>
    </div>

    <footer class="ed-foot">
        <span class="ed-ref" id="edRef" hidden>A1</span>
        <span id="edStatus">加载中…</span>
        <span class="ed-spacer"></span>
        <span id="edTip"></span>
    </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/api-bridge.js?v=20261112b"></script>
<script src="js/edit-types.js"></script>
<script src="js/dialog.js"></script>
<script src="js/editor-page.js"></script>
</body>
</html>
