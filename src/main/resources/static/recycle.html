<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>回收站 · 云盘</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="list">

<div class="shell">

    <!-- ============ 左侧深色导航 ============ -->
    <aside class="rail" id="rail">
        <div class="rail-brand">
            <span class="mark">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 19.2a4.3 4.3 0 0 1-.45-8.57 5.75 5.75 0 0 1 11.13-1.06 4.3 4.3 0 0 1-.28 9.63H6.6Z"/></svg>
            </span>
            <span class="rail-brand-t">
                <strong>云盘</strong>
                <em>Cloud Disk</em>
            </span>
        </div>

        <div class="rail-scroll">
            <div class="rail-group">
                <div class="rail-label">导航</div>
                <div class="rail-nav">
                    <a class="chip" href="index.html">
                        <span class="chip-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.2A2.2 2.2 0 0 1 5.2 6h3.4l1.8 2h8.4A2.2 2.2 0 0 1 21 10.2v7.6A2.2 2.2 0 0 1 18.8 20H5.2A2.2 2.2 0 0 1 3 17.8V8.2Z"/></svg></span>
                        <span class="chip-t">文件工作台</span>
                    </a>
                    <a class="chip active" href="recycle.html">
                        <span class="chip-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9 6.5V4.4h6v2.1"/><path d="M6.4 6.5 7.3 20h9.4l.9-13.5"/><path d="M10 10.5v6M14 10.5v6"/></svg></span>
                        <span class="chip-t">回收站</span>
                    </a>
                    <a class="chip" href="admin.html" id="adminLink" hidden>
                        <span class="chip-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5.6c0 4 3 7.5 7 8.9 4-1.4 7-4.9 7-8.9V6l-7-3Z"/><path d="M9.6 12.2 11 13.6l3.4-3.4"/></svg></span>
                        <span class="chip-t">用户管理</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="rail-user" id="railUser" hidden>
            <span class="u-ava" id="userAvatar">—</span>
            <span class="u-meta">
                <strong id="userName">—</strong>
                <em id="userRole">—</em>
            </span>
            <button class="u-act" id="logoutBtn" type="button" title="退出登录" aria-label="退出登录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10"/><path d="m15 8.5 3.5 3.5L15 15.5"/><path d="M18.5 12H9"/></svg>
            </button>
        </div>

        <div class="rail-foot">
            <span class="kbd-hint"><kbd>/</kbd> 搜索　<kbd>Esc</kbd> 取消选择</span>
        </div>
    </aside>

    <div class="rail-mask" id="railMask"></div>

    <!-- ============ 右侧工作区 ============ -->
    <div class="workspace">

        <header class="topbar">
            <button class="rail-toggle" id="railToggle" type="button" aria-label="打开导航">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>

            <nav class="crumb" aria-label="当前位置">
                <span>云盘</span>
                <span class="crumb-sep">/</span>
                <span class="crumb-cur">回收站</span>
            </nav>

            <div class="topbar-right">
                <label class="search">
                    <span class="search-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.9-3.9"/></svg></span>
                    <input type="text" id="searchInput" placeholder="搜索已删除文件名…" autocomplete="off" spellcheck="false">
                </label>

                <button class="btn btn-ghost" id="clearBtn" type="button">
                    <span class="btn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9 6.5V4.4h6v2.1"/><path d="M6.4 6.5 7.3 20h9.4l.9-13.5"/></svg></span>
                    <span>清空回收站</span>
                </button>
            </div>
        </header>

        <main class="main recycle-main">

            <div class="page-head">
                <h1>回收站</h1>
                <div class="stats">
                    <div class="stat"><span class="stat-k">文件</span><span class="stat-v" id="statTotal">—</span></div>
                    <div class="stat"><span class="stat-k">占用</span><span class="stat-v" id="statSize">—</span></div>
                    <div class="stat"><span class="stat-k">保留</span><span class="stat-v" id="statKeep">—</span></div>
                </div>
            </div>

            <p class="recycle-tip" id="recycleTip">
                删除的文件会先放到这里，<b>7 天</b>内可以恢复；超过期限将自动彻底删除，无法找回。
            </p>

            <div class="rlist">
                <div class="rhead">
                    <span class="rc-check"><input type="checkbox" id="checkAll" aria-label="全选本页"></span>
                    <span>名称</span>
                    <span>大小 · 原分组</span>
                    <span>删除时间</span>
                    <span class="rc-expire">剩余</span>
                    <span class="lh-right" style="text-align:right;">操作</span>
                </div>
                <div id="rRows"></div>
            </div>

            <div class="empty" id="empty" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9 6.5V4.4h6v2.1"/><path d="M6.4 6.5 7.3 20h9.4l.9-13.5"/></svg>
                <p>回收站是空的</p>
                <small>在工作台删除的文件会出现在这里</small>
            </div>

            <div class="pagination" id="pagination"></div>
        </main>
    </div>
</div>

<!-- ============ 批量操作条 ============ -->
<div class="batch-bar" id="batchBar" hidden>
    <span class="batch-count"><b id="batchCount">0</b>项已选</span>
    <span class="batch-sep"></span>
    <button class="batch-btn" id="batchRestore" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4.5V10h5.5"/></svg>
        <span>恢复</span>
    </button>
    <button class="batch-btn danger" id="batchPurge" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9 6.5V4.4h6v2.1"/><path d="M6.4 6.5 7.3 20h9.4l.9-13.5"/></svg>
        <span>彻底删除</span>
    </button>
    <span class="batch-sep"></span>
    <button class="batch-close" id="batchClear" type="button" title="取消选择" aria-label="取消选择">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
</div>

<!-- ============ 预览 ============ -->
<div class="modal" id="imageModal" hidden>
    <div class="modal-mask" data-close="imageModal"></div>
    <div class="modal-body modal-media">
        <button class="modal-close" type="button" data-close="imageModal" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <img id="imagePreview" src="" alt="预览">
        <div class="gallery-cap"><span class="gallery-name" id="imgName"></span></div>
    </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/dialog.js"></script>
<script src="js/recycle.js"></script>
</body>
</html>
